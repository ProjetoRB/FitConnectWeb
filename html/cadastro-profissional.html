<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Profissional | FitConnect</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cadastro-profissional.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <header>
    <div class="logo">FitConnect</div>
    <nav>
      <a href="login.html" class="btn-voltar">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>
    </nav>
  </header>

  <section class="page">
    <div class="container-prof">

      <h1>Cadastro Profissional</h1>

      <form id="formProfissional">

        <div class="input-box">
          <input type="text" id="nomeCompletoProf" placeholder="Nome completo" required>
          <i class="bi bi-person"></i>
        </div>

        <div class="input-box">
          <input type="text" id="dataNascimentoProfissional" placeholder="DD/MM/AAAA" maxlength="10" required>
          <i class="bi bi-calendar"></i>
          <small class="erro-data"></small>
        </div>

        <div class="input-box">
          <select id="sexoProf" required>
            <option value="">Sexo</option>
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
          <i class="bi bi-gender-ambiguous"></i>
        </div>

        <div class="input-box">
          <input type="email" id="emailProf" placeholder="Email" required>
          <i class="bi bi-envelope"></i>
        </div>

        <div class="input-box">
          <input type="text" id="cpfProf" placeholder="CPF" required>
          <i class="bi bi-card-text"></i>
        </div>

        <div class="input-box">
          <select id="areaProfissional" required>
            <option value="">Área Profissional</option>
            <option value="Nutricionista">Nutricionista</option>
            <option value="Personal Trainer">Personal Trainer</option>
            <option value="Fisioterapeuta">Fisioterapeuta</option>
          </select>
          <i class="bi bi-briefcase"></i>
        </div>

        <div class="input-box">
          <label id="documentoLabel" style="display:block; text-align:left; color:#555; font-size:13px; font-weight:600; margin-bottom:-4px; margin-top:6px;">Documento Profissional</label>
          <input type="text" id="documentoProfissional" placeholder="Digite seu Documento Profissional" required>
          <i class="bi bi-file-earmark-text"></i>
        </div>

        <div class="input-box">
          <input type="password" id="senhaProf" placeholder="Senha" required>
          <i class="bi bi-eye" id="btn-senha-prof"></i>
        </div>

        <button type="submit">Cadastrar</button>

      </form>

    </div>
  </section>

  <script src="Js/script.js"></script>
</body>
</html>
