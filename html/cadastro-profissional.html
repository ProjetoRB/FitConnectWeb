<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Profissional | FitConnect</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cadastro-profissional.css">
  <!-- pode reutilizar o mesmo CSS, ou criar um específico -->
</head>
<body>
  <header>
    <div class="logo">FitConnect</div>
    <nav>
      <a href="index.html">Voltar</a>
    </nav>
  </header>

  <section class="page">
    <div class="card big-card">
      <h2>Cadastro Profissional</h2>
      <form id="formProfissional">
        <label>Nome Completo</label>
        <input type="text" id="nomeCompletoProf" required>

        <label>Email</label>
        <input type="email" id="emailProf" required>

        <label>CPF</label>
        <input type="text" id="cpfProf" required>

        <label>Área Profissional</label>
        <select id="areaProfissional" required>
          <option value="">Selecione</option>
          <option value="Nutricionista">Nutricionista</option>
          <option value="Personal Trainer">Personal Trainer</option>
          <option value="Fisioterapeuta">Fisioterapeuta</option>
        </select>

        <label id="documentoLabel">Documento Profissional</label>
        <input type="text" id="documentoProfissional" required>

        <label>Senha</label>
        <input type="password" id="senhaProf" required>

        <button type="submit">Cadastrar</button>
      </form>
    </div>
  </section>

  <script src="Js/script.js"></script>
</body>
</html>
