<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login e Cadastro | FitConnect</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cadastro-aluno.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <header>
    <div class="logo">FitConnect</div>
    <nav>
      <a href="servicos.html">Serviços</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <section class="page">
    <div class="container">

      <!-- LOGIN -->
      <div class="form-container sign-in-container">
        <form id="formLogin">
          <h1>Entrar</h1>

          <div class="input-box">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <i class="bi bi-envelope"></i>
          </div>

          <div class="input-box">
            <input type="password" id="loginSenha" placeholder="Senha" required>
            <i class="bi bi-eye" id="btn-senha"></i>
          </div>

          <a href="#">Esqueceu a senha?</a>
          <button type="submit">Entrar</button>
        </form>
      </div>

      <!-- CADASTRO ALUNO -->
      <div class="form-container sign-up-container">
        <form id="formAluno">
          <h1>Criar Conta</h1>

          <div class="input-box">
            <input type="text" id="nomeCompleto" placeholder="Nome completo" required>
            <i class="bi bi-person"></i>
          </div>

          <div class="input-box">
            <input type="email" id="email" placeholder="Email" required>
            <i class="bi bi-envelope"></i>
          </div>

          <div class="input-box">
            <input type="text" id="cpf" placeholder="CPF" required>
            <i class="bi bi-card-text"></i>
          </div>

          <div class="two-inputs">
            <input type="text" id="peso" placeholder="Peso" required>
            <input type="text" id="altura" placeholder="Altura" required>
          </div>

          <select id="sexo" required>
            <option value="">Sexo</option>
            <option>Masculino</option>
            <option>Feminino</option>
          </select>

          <div class="input-box">
            <input type="password" id="senha" placeholder="Senha" required>
            <i class="bi bi-eye" id="btn-senha-cadastro"></i>
          </div>

          <button type="submit">Cadastrar</button>

                  <a class="link-profissional" href="cadastro-profissional.html">Sou profissional
                  </a>

        </form>
      </div>

      <!-- OVERLAY -->
      <div class="overlay-container">
        <div class="overlay">

          <div class="overlay-panel overlay-left">
            <h1>Bem-vindo de volta!</h1>
            <p>Para continuar conectado, faça login com suas informações.</p>
            <button class="ghost" id="signIn" type="button">Entrar</button>
          </div>

          <div class="overlay-panel overlay-right">
            <h1>SEJA BEM-VINDO!</h1>
            <p>Entre com suas informações e comece sua jornada com a gente.</p>
            <button class="ghost" id="signUp" type="button">Crie sua conta</button>
          </div>

        </div>
      </div>

    </div>
  </section>

  <script src="Js/script.js"></script>
</body>
</html>
