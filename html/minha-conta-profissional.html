<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minha Conta | FitConnect</title>

  <link rel="stylesheet" href="css/minhaconta.css">
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

  <header>
    <div class="logo">FitConnect</div>

    <nav>
      <a href="dashboard-profissional.html" class="btn-voltar">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </a>
    </nav>
  </header>

  <section class="page">

    <div class="card perfil-card">

      <div class="card-header">
        <h2><i class="fas fa-id-card"></i> Meus dados</h2>
        <button type="button" class="btn-editar" id="btnEditar">
          <i class="fas fa-pen"></i> Editar
        </button>
      </div>

      <form id="formPerfil">

        <div>
          <label>Nome completo</label>
          <input type="text" id="perfilNome" disabled>
        </div>

        <div>
          <label>Data de nascimento</label>
          <input type="text" id="perfilNascimento" placeholder="DD/MM/AAAA" disabled>
        </div>

        <div>
          <label>Sexo</label>
          <select id="perfilSexo" disabled>
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </div>

        <div>
          <label>Email</label>
          <input type="email" id="perfilEmail" disabled>
        </div>

        <div>
          <label>CPF</label>
          <input type="text" id="perfilCpf" readonly disabled>
        </div>

        <div>
          <label>Área Profissional</label>
          <select id="perfilArea" disabled>
            <option value="">Selecione</option>
            <option value="Nutricionista">Nutricionista</option>
            <option value="Personal Trainer">Personal Trainer</option>
            <option value="Fisioterapeuta">Fisioterapeuta</option>
          </select>
        </div>

        <div>
          <label id="documentoLabel">Documento Profissional</label>
          <input type="text" id="perfilDocumento" disabled>
        </div>

        <div>
          <label>Nova senha (deixe em branco para não alterar)</label>
          <input type="password" id="perfilSenha" placeholder="••••••••" disabled>
        </div>

        <div class="form-actions hidden" id="formActions">
          <button type="button" class="btn-cancelar" id="btnCancelar">
            <i class="fas fa-times"></i> Cancelar
          </button>
          <button type="submit" class="btn-primary">
            <i class="fas fa-check"></i> Salvar alterações
          </button>
        </div>

      </form>

    </div>

  </section>

  <script src="Js/script.js"></script>
  <script src="Js/perfil-profissional.js"></script>

</body>
</html>
